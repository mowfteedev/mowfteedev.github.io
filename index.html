<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mowftee — Networking Computer Engineer</title>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect rx='8' width='64' height='64' fill='%230b0f19'/><text x='32' y='38' font-family='monospace' font-size='36' font-weight='700' fill='%2306b6d4' text-anchor='middle' dominant-baseline='middle'>M</text></svg>" />
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    /* MÀU SẮC */
    :root{
      --bg: #0b0f19;         /* nền tối */
      --text: #d1d5db;       /* chữ trắng xám nhạt */
      --text-muted: #9ca3af; /* chữ xám nhạt hơn */
      --accent: #06b6d4;     /* duy nhất màu nhấn (cyan) */
      --muted-border: rgba(209,213,219,0.06); /* viền mảnh, rất nhẹ */
    }

    /* Toàn trang */
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Sidebar cố định bên trái */
    .sidebar {
      position:fixed;
      left:0;
      top:0;
      width:80px;
      height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2rem;
      padding:2rem 0;
      box-sizing:border-box;
      z-index:10;
    }

    /* Icon liên hệ xếp dọc */
    .sidebar-icons {
      display:flex;
      flex-direction:column;
      gap:1.5rem;
    }

    .sidebar-link {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:44px;
      height:44px;
      border:1px solid var(--muted-border);
      color:var(--text);
      background:transparent;
      text-decoration:none;
      border-radius:4px;
      transition: border-color 180ms ease, background-color 180ms ease, color 180ms ease;
      box-sizing:border-box;
    }

    .sidebar-link:hover,
    .sidebar-link:focus {
      border-color:var(--accent);
      background-color: rgba(6,182,212,0.06);
      color:var(--accent);
    }

    .sidebar-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset:4px;
    }

    .sidebar-link svg {
      width:20px;
      height:20px;
      display:block;
      fill:currentColor;
    }

    /* Đường kẻ mảnh ngang (chuyển sang dọc, từ bottom lên top) */
    .sidebar-divider {
      width:1px;
      height:2rem;
      background:var(--muted-border);
    }

    /* Chữ "Follow Me" xoay 90 độ */
    .sidebar-label {
      writing-mode:vertical-rl;
      transform:rotate(180deg);
      font-size:0.75rem;
      letter-spacing:0.15em;
      color:var(--text-muted);
      text-transform:uppercase;
      font-weight:600;
    }

    /* Container nội dung giữa màn hình */
    .main-container {
      margin-left:80px;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2rem;
      box-sizing:border-box;
    }

    .content {
      text-align:center;
      width:100%;
      max-width:880px;
    }

    /* Tên lớn, serif nếu load được, fallback serif hệ thống */
    h1 {
      margin:0;
      font-size:clamp(2rem, 6vw, 4rem);
      line-height:1;
      color:var(--accent);
      font-weight:700;
      letter-spacing:0.02em;
      font-family: "Playfair Display", Georgia, serif;
    }

    /* Dòng giới thiệu (typewriter) — monospace, serif fallback được dùng cho h1 */
    .role {
      margin-top:1.5rem;
      margin-bottom:3rem;
      font-size:clamp(0.95rem, 2.2vw, 1.25rem);
      color:var(--text);
      white-space:pre;
      display:inline-block;
      min-height:1.4em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
    }

    /* Con trỏ "_" màu accent */
    .cursor {
      color:var(--accent);
      font-weight:700;
      margin-left:0.1em;
      display:inline-block;
    }

    /* Văn bản ẩn cho screen-reader */
    .sr-only{
      position:absolute !important;
      width:1px;height:1px;
      padding:0;margin:-1px;overflow:hidden;
      clip:rect(0 0 0 0);white-space:nowrap;border:0;
    }

    /* Responsive: trên màn hình hẹp */
    @media (max-width:768px){
      .sidebar {
        position:static;
        width:100%;
        height:auto;
        flex-direction:row;
        gap:1.5rem;
        padding:1.5rem 0;
        margin-bottom:1rem;
        border-bottom:1px solid var(--muted-border);
      }

      .sidebar-icons {
        flex-direction:row;
        gap:1rem;
      }

      .sidebar-divider {
        width:2rem;
        height:1px;
      }

      .sidebar-label {
        writing-mode:horizontal-tb;
        transform:none;
        font-size:0.65rem;
        letter-spacing:0.1em;
      }

      .main-container {
        margin-left:0;
        padding:1.5rem;
      }
    }

    @media (max-height:480px){
      .content { transform: translateY(-4%); }
    }
  </style>
</head>
<body>
  <!-- Sidebar cố định bên trái -->
  <aside class="sidebar" aria-label="Liên hệ">
    <div class="sidebar-icons">
      <a class="sidebar-link" href="https://github.com/mowfteedev" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <!-- GitHub Mark SVG -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 0.297C5.37 0.297 0 5.667 0 12.297c0 5.303 3.438 9.8 8.205 11.387.6.11.82-.26.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-[...]"/>
        </svg>
      </a>

      <a class="sidebar-link" href="mailto:mowfteedev@gmail.com" aria-label="Email">
        <!-- Mail icon SVG -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.89 2 1.99 2H20c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/>
        </svg>
      </a>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-label">Follow Me</div>
  </aside>

  <!-- Nội dung chính -->
  <main class="main-container" role="main">
    <div class="content" aria-live="polite">
      <h1 id="name">Mowftee</h1>

      <div>
        <div id="role" class="role" data-text="Mạng máy tính & Truyền thông dữ liệu"></div>
        <span id="cursor" class="cursor" aria-hidden="true">_</span>
      </div>
    </div>
  </main>

  <script>
    /* Typewriter effect: gõ 1 lần khi load, con trỏ nhấp nháy */
    (function(){
      const roleEl = document.getElementById('role');
      const cursorEl = document.getElementById('cursor');
      const fullText = roleEl.getAttribute('data-text') || '';
      const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const typingDelay = 50; // ms giữa các ký tự
      const blinkInterval = 600; // ms nhấp nháy con trỏ
      let i = 0;
      let blinkTimer = null;

      function setCursorVisible(v){
        cursorEl.style.opacity = v ? '1' : '0';
      }

      function startBlinking(){
        if (blinkTimer) return;
        blinkTimer = setInterval(() => {
          cursorEl.style.opacity = cursorEl.style.opacity === '0' ? '1' : '0';
        }, blinkInterval);
      }

      function typeNextChar(){
        if (i <= fullText.length - 1){
          roleEl.textContent += fullText[i];
          i++;
          const jitter = Math.random() * 30 - 15;
          setTimeout(typeNextChar, typingDelay + jitter);
        } else {
          startBlinking();
        }
      }

      if (prefersReduced){
        roleEl.textContent = fullText;
        setCursorVisible(false);
      } else {
        roleEl.textContent = '';
        setCursorVisible(true);
        startBlinking();
        setTimeout(() => {
          if (blinkTimer) { clearInterval(blinkTimer); blinkTimer = null; cursorEl.style.opacity = '1'; }
          typeNextChar();
        }, 400);
      }

      document.addEventListener('focusin', () => { cursorEl.style.opacity = '1'; });
    })();
  </script>
</body>
</html>
